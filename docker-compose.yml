# Tayf Studio — production-oriented compose stack (v0.5.0).
#
# Builds real images (backend/Dockerfile, frontend/Dockerfile, ai-gateway/Dockerfile),
# runs everything as non-root, with healthchecks and a named volume for data.
#
# REQUIRED before `docker compose up`: JWT_SECRET (refuses to boot without it):
#   cp .env.example .env  ->  edit JWT_SECRET (python -c "import secrets; print(secrets.token_hex(32))")
#
# UI:  http://localhost:8080   API: http://localhost:8080/api/v1  (proxied same-origin)

services:
  backend:
    build: ./backend
    image: tayf-backend:0.5.0
    environment:
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (never commit it)}
      DATABASE_URL: sqlite:////app/data/tayf.db
      LOCAL_STORAGE_DIR: /app/data/storage
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_GATEWAY_URL: http://ai-gateway:3030
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      SIGNUP_CREDITS: ${SIGNUP_CREDITS:-100}
    volumes:
      - tayf-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      ai-gateway:
        condition: service_started

  ai-gateway:
    build: ./ai-gateway
    image: tayf-ai-gateway:0.5.0
    environment:
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:-}
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: tayf-frontend:0.5.0
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  tayf-data:
