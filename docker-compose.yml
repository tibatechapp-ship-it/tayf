# Al-Manazir — production-oriented compose stack (v0.5.0).
#
# Builds real images (backend/Dockerfile, frontend/Dockerfile, ai-gateway/Dockerfile),
# runs everything as non-root, with healthchecks and a named volume for data.
#
# REQUIRED before `docker compose up`: JWT_SECRET (refuses to boot without it):
#   cp .env.example .env  ->  edit JWT_SECRET (python -c "import secrets; print(secrets.token_hex(32))")
#
# UI:  http://localhost:8080   API: http://localhost:8080/api/v1  (proxied same-origin)

services:
  backend:
    build: ./backend
    image: tayf-backend:0.5.0
    environment:
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (never commit it)}
      DATABASE_URL: sqlite:////app/data/tayf.db
      LOCAL_STORAGE_DIR: /app/data/storage
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_TTL_DAYS: ${STORAGE_TTL_DAYS:-7}
      STORAGE_SIGNED_URL_TTL_SECONDS: ${STORAGE_SIGNED_URL_TTL_SECONDS:-21600}
      CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-60}
      FILES_PUBLIC: ${FILES_PUBLIC:-false}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_GATEWAY_URL: http://ai-gateway:3030
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      SIGNUP_CREDITS: ${SIGNUP_CREDITS:-100}
      # Jobs stay PENDING here; the worker service below claims them.
      EXTERNAL_JOB_WORKER: "true"
    volumes:
      - tayf-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      ai-gateway:
        condition: service_started

  worker:
    build: ./backend
    image: tayf-backend:0.5.0
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env (never commit it)}
      DATABASE_URL: sqlite:////app/data/tayf.db
      LOCAL_STORAGE_DIR: /app/data/storage
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_TTL_DAYS: ${STORAGE_TTL_DAYS:-7}
      STORAGE_SIGNED_URL_TTL_SECONDS: ${STORAGE_SIGNED_URL_TTL_SECONDS:-21600}
      CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-60}
      FILES_PUBLIC: ${FILES_PUBLIC:-false}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_GATEWAY_URL: http://ai-gateway:3030
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:-}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-600}
      JOB_POLL_SECONDS: ${JOB_POLL_SECONDS:-2}
    volumes:
      - tayf-data:/app/data
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  ai-gateway:
    build: ./ai-gateway
    image: tayf-ai-gateway:0.5.0
    environment:
      # Must listen on the container network, not just its own loopback.
      AI_GATEWAY_HOST: 0.0.0.0
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:?set AI_GATEWAY_TOKEN in .env before docker compose up}
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: tayf-frontend:0.5.0
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  tayf-data:
