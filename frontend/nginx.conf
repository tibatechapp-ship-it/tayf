# Tayf Studio frontend — unprivileged nginx (listens 8080, user nginx).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API + signed artifact URLs are same-origin; nginx proxies them to the
    # FastAPI backend service (compose network alias: `backend`).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 10m;
    }

    # Hashed assets are immutable — cache hard.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
